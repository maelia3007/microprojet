<!DOCTYPE html>
<html>

<head>
  <title>Ma première app AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script> 
</head>

<body>
    <a-scene embedded
    arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best ; changeMatrixMode: modelViewMatrix;"
    renderer="sortObjects: true; antialias: true; colorManagement: true; logarithmicDepthBuffer: true;"

    vr-mode-ui="enabled: false"

    smooth=" true" smoothCount="5" smoothTolerance=".05" smoothThreshold="5"
    
    sourceWidth="800" sourceHeight="600" displayWidth="1280" displayHeight="720">

    <a-assets>
        <img id="image" src="./mama.jpeg">
      </a-assets>
      
              <a-marker type='barcode' value='35'>
         
                <a-image src="#image"
                rotation="270 0 0"
                width="3.5"
                height="3.5"></a-image>
      
                  <a-text value="arrondi" 
                  side="double" position = "3 0 -5" rotation="270 0 0" 
                  width="8"
                  color="#FF0033" align="center" >
                  </a-text>
      
      
                <a-text value="modulable" 
                side="double" position = "-4 1 -4" rotation="270 0 0" 
                width="8"
                color="#FF0066" align="center" >
                </a-text>
         
              <a-text value="petales" 
              side="double" position = "-3 2 -3" rotation="270 0 0" 
              width="8"
              color="#FF0099" align="center" >
              </a-text>
         
            <a-text value="demontable" 
            side="double" position = "-3 3 4" rotation="270 0 0" 
            width="8"
            color="#FF00CC" align="center" >
            </a-text>
         
          <a-text value="repetition" 
          side="double" position = "-1 4 -1" rotation="270 0 0" 
          width="8"
          color="#FF00FF" align="center" >
          </a-text>
      
         
        <a-text value="memphis" 
        side="double" position = "-4 2 0" rotation="270 0 0" 
        width="8"
        color="#CC00FF" align="center" >
        </a-text>
      
         
        <a-text value="reflechissant" 
        side="double" position = "5 3 -1" rotation="270 0 0" 
        width="8"
        color="#CC00CC" align="center" >
        </a-text>
         
        <a-text value="assemblage" 
        side="double" position = "5 1 -5" rotation="270 0 0" 
        width="8"
        color="CC0099" align="center" >
        </a-text>
      
         
        <a-text value="monomateriau" 
        side="double" position = "3 4 0" rotation="270 0 0" 
        width="8"
        color="#CCOO66" align="center" >
        </a-text>
         
        <a-text value="poetique" 
        side="double" position = "0 3 0" rotation="270 0 0" 
        width="8"
        color="#CC0033" align="center" >
        </a-text>
      
      </a-marker>

        <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
